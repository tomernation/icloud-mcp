name: icloud-auth
services:
  database:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    restart: unless-stopped
    env_file: /var/lib/icloud-mcp/oauth/database.env
    volumes:
      - /var/lib/icloud-mcp/oauth/postgres:/var/lib/postgresql/data
    networks: [auth]
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start, --import-realm]
    restart: unless-stopped
    env_file: /var/lib/icloud-mcp/oauth/keycloak.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://auth.chasid.net
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx768m'
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - /var/lib/icloud-mcp/oauth/import:/opt/keycloak/data/import:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1200m
    pids_limit: 256
    networks: [auth]
    depends_on:
      database:
        condition: service_healthy
networks:
  auth:
    name: icloud-auth
